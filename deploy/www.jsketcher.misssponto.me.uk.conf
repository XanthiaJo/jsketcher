server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/www.jsketcher.misssponto.me.uk.key;
  ssl_certificate /etc/nginx/ssl-certificates/www.jsketcher.misssponto.me.uk.crt;
  server_name www.jsketcher.misssponto.me.uk jsketcher.misssponto.me.uk;
  root /home/misssponto-jsketcher/htdocs/repo/dist;

  access_log /home/misssponto-jsketcher/logs/nginx/access.log main;
  error_log /home/misssponto-jsketcher/logs/nginx/error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  location /webhook {
    proxy_pass http://127.0.0.1:3004;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
  }

  include /etc/nginx/global_settings;

  index index.html;

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
